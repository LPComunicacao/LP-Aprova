let view="dashboard",activeFilter="Todos",selectedClient=1;
const save=async()=>{
  await loadCloudData();
}; async function loadCloudData(){
  const { data: { user } } = await sb.auth.getUser();

  if(!user){
    return;
  }

  const { data: admin } = await sb
    .from("admin_users")
    .select("user_id")
    .eq("user_id", user.id)
    .maybeSingle();

  if(admin){
    window.lpRole = "admin";

    const { data: cloudClients, error: clientsError } = await sb
      .from("clients")
      .select("*")
      .order("id");

    if(clientsError){
      console.error(clientsError);
      return;
    }

    const { data: cloudPosts, error: postsError } = await sb
      .from("posts")
      .select("*")
      .order("created_at", { ascending:false });

    if(postsError){
      console.error(postsError);
      return;
    }

    clients = cloudClients || [];
    posts = (cloudPosts || []).map(p => ({
      id:p.id,
      client:p.client_id,
      title:p.title,
      type:p.type,
      status:p.status,
      caption:p.caption,
      artTitle:p.art_title,
      artSub:p.art_sub,
      color:p.color,
      feedback:p.feedback
    }));

    return;
  }

  const { data: relation, error: relationError } = await sb
    .from("client_users")
    .select("client_id")
    .eq("user_id", user.id)
    .maybeSingle();

  if(relationError || !relation){
    console.error(relationError || "Cliente não vinculado.");
    return;
  }

  window.lpRole = "client";
  window.lpClientId = relation.client_id;

  const { data: cloudClients } = await sb
    .from("clients")
    .select("*")
    .eq("id", relation.client_id);

  const { data: cloudPosts } = await sb
    .from("posts")
    .select("*")
    .eq("client_id", relation.client_id)
    .order("created_at", { ascending:false });

  clients = cloudClients || [];

  posts = (cloudPosts || []).map(p => ({
    id:p.id,
    client:p.client_id,
    title:p.title,
    type:p.type,
    status:p.status,
    caption:p.caption,
    artTitle:p.art_title,
    artSub:p.art_sub,
    color:p.color,
    feedback:p.feedback
  }));
}

const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const client=id=>clients.find(c=>c.id===Number(id))||clients[0];
const tag=s=>`<span class="tag ${s==="Aprovado"?"ok":s==="Alteração solicitada"?"change":"wait"}">${esc(s)}</span>`;
function art(p){let palettes=[["#e8ddff","#f9e8ef","#39215e"],["#f4e6ff","#d8c9f5","#4d2d77"],["#d9e9ff","#eee4ff","#263c72"],["#dcecff","#d5e8ff","#183d73"],["#f7e4e8","#f0d5ff","#63365f"],["#efe7ff","#e0efff","#493477"]],a=palettes[p.color%palettes.length];return `<div class="art" style="background:linear-gradient(145deg,${a[0]},${a[1]});color:${a[2]}"><span class="art-label">${esc(p.type)}</span><div><h3>${esc(p.artTitle).replace(/\\n/g,"<br>")}</h3><p>${esc(p.artSub)}</p><div style="margin-top:24px;font-size:10px;letter-spacing:.15em;font-weight:800">LP COMUNICAÇÃO</div></div></div>`}
function stats(){let waiting=posts.filter(p=>p.status==="Aguardando aprovação").length,changes=posts.filter(p=>p.status==="Alteração solicitada").length,approved=posts.filter(p=>p.status==="Aprovado").length;return `<div class="stats"><div class="stat"><span>Clientes ativos</span><strong>${clients.length}</strong></div><div class="stat"><span>Conteúdos no painel</span><strong>${posts.length}</strong></div><div class="stat"><span>Aguardando aprovação</span><strong>${waiting}</strong></div><div class="stat"><span>Alterações solicitadas</span><strong>${changes}</strong></div></div>`}
function postCard(p,admin=true){return `<article class="post-card">${art(p)}<div class="post-info"><strong>${esc(p.title)}</strong><div class="muted">${esc(client(p.client)?.name||"Cliente")} · ${esc(p.type)}</div><div style="margin-top:9px">${tag(p.status)}</div>${admin?`<div class="post-actions"><button class="outline" onclick="editPost(${p.id})">Editar</button><button class="soft" onclick="openReview(${p.id})">Ver aprovação</button></div>`:`<p class="caption">${esc(p.caption)}</p><div class="post-actions"><button class="primary" onclick="setStatus(${p.id},'Aprovado')">✓ Aprovar</button><button class="outline" onclick="requestChange(${p.id})">Solicitar ajuste</button></div>`}</div></article>`}

function postsView(){let list=posts.filter(p=>activeFilter==="Todos"||p.status===activeFilter);return `<div class="heading"><div><h1>Conteúdos</h1><p>Organize publicações e acompanhe o retorno dos clientes.</p></div><button class="primary" onclick="newPost()">＋ Novo conteúdo</button></div><div class="panel"><div class="panel-head"><h2>Biblioteca de conteúdos</h2><div class="filters"><select onchange="activeFilter=this.value;render()">${["Todos","Aguardando aprovação","Aprovado","Alteração solicitada"].map(s=>`<option ${s===activeFilter?"selected":""}>${s}</option>`).join("")}</select><input id="search" placeholder="Buscar conteúdo ou cliente…" oninput="searchPosts()"></div></div><div class="cards" id="postCards">${list.map(p=>postCard(p)).join("")||'<div class="empty">Nenhum conteúdo encontrado.</div>'}</div></div>`}

  return `

      </div>

        <div class="panel-head">
          <div>
            <h2>Seu calendário de conteúdos</h2>
            <div class="muted">Aprove ou solicite ajustes em cada peça.</div>

        <div class="tabs">
          ${["Todos","Aguardando aprovação","Aprovado","Alteração solicitada"].map(s=>`
            <button class="${activeFilter===s?"active":""}"
              onclick="activeFilter='${s}';render()">${s}</button>
          `).join("")}
        </div>

        <div class="preview-grid">
          ${list.filter(p=>activeFilter==="Todos"||p.status===activeFilter)
            .map(p=>postCard(p,false)).join("")
            || '<div class="empty">Não há conteúdos nesta categoria.</div>'}
        </div>
      </div>
    </div>
  `;
}
 💜</h1><p>Confira os conteúdos preparados para sua marca e deixe seu retorno.</di/p><v><div class="field" style="margin:0;min-width:210px"><label style="color:#eee">Visualizar portal de</label><select onchange="selectedClient=Number(this.value);render()">${clients.map(x=>`<option value="${x.id}" ${x.id===c.id?"selected":""}>${esc(x.name)}</option>`).join("")}</select></div></div><div class="panel"><div class="panel-head"><div><h2>Seu calendário de conteúdos</h2><div class="muted">Aprove ou solicite ajustes em cada peça.</div></div><span class="tag">${list.filter(p=>p.status==="Aguardando aprovação").length} pendentes</span></div><div class="tabs">${["Todos","Aguardando aprovação","Aprovado","Alteração solicitada"].map(s=>`<button class="${activeFilter===s?"active":""}" onclick="activeFilter='${s}';render()">${s}</button>`).join("")}</div><div class="preview-grid">${list.filter(p=>activeFilter==="Todos"||p.status===activeFilter).map(p=>postCard(p,false)).join("")||'<div class="empty">Não há conteúdos nesta categoria.</div>'}</div></div><div class="muted">Demonstração: os botões atualizam apenas este navegador. O portal real terá links privados e dados separados por cliente.</div></div>`}
function render(){document.getElementById("crumb").textContent={dashboard:"Visão geral",posts:"Conteúdos",clients:"Clientes",client:"Portal do cliente"}[view];document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.view===view));document.getElementById("app").innerHTML=({dashboard,posts:postsView,clients:clientsView,client:clientView}[view])()}
function setView(v){view=v;activeFilter="Todos";render()}document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>setView(b.dataset.view));
function toggleNav(){let s=document.querySelector(".side");s.style.display=s.style.display==="flex"?"none":"flex"}
function toast(s){let t=document.getElementById("toast");t.textContent=s;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2600)}
function modal(content){document.getElementById("modal").innerHTML=content;document.getElementById("modalBack").classList.add("show")}
function closeModal(){document.getElementById("modalBack").classList.remove("show")}
document.getElementById("modalBack").addEventListener("click",e=>{if(e.target.id==="modalBack")closeModal()});
function newClient(){modal(`<div class="modal-head"><h2>Novo cliente</h2><button class="outline" onclick="closeModal()">✕</button></div><div class="field"><label>Nome da marca / cliente</label><input id="cname" placeholder="Ex.: Florita Moda Feminina"></div><div class="field"><label>Descrição (opcional)</label><input id="ccontact" placeholder="Área de atuação ou contato"></div><div class="modal-foot"><button class="outline" onclick="closeModal()">Cancelar</button><button class="primary" onclick="saveClient()">Cadastrar cliente</button></div>`)}
function saveClient(){let name=document.getElementById("cname").value.trim();if(!name){toast("Informe o nome do cliente.");return}let id=Math.max(0,...clients.map(c=>c.id))+1;clients.push({id,name,contact:document.getElementById("ccontact").value,initials:name.split(/\s+/).slice(0,2).map(x=>x[0]).join("").toUpperCase()});save();closeModal();render();toast("Cliente cadastrado neste navegador.")}
function newPost(){modal(`<div class="modal-head"><h2>Novo conteúdo</h2><button class="outline" onclick="closeModal()">✕</button></div><div class="field"><label>Cliente</label><select id="pclient">${clients.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join("")}</select></div><div class="field"><label>Título interno</label><input id="ptitle" placeholder="Ex.: Post de apresentação"></div><div class="field"><label>Formato</label><select id="ptype"><option>Post</option><option>Carrossel · 4 páginas</option><option>Reels</option></select></div><div class="field"><label>Texto principal da arte</label><input id="part" placeholder="Título que aparece na prévia"></div><div class="field"><label>Legenda</label><textarea id="pcaption" placeholder="Escreva a legenda…"></textarea></div><div class="modal-foot"><button class="outline" onclick="closeModal()">Cancelar</button><button class="primary" onclick="savePost()">Adicionar conteúdo</button></div>`)}
function savePost(){let title=document.getElementById("ptitle").value.trim();if(!title){toast("Informe um título.");return}let id=Math.max(0,...posts.map(p=>p.id))+1;posts.unshift({id,client:Number(document.getElementById("pclient").value),title,type:document.getElementById("ptype").value,status:"Aguardando aprovação",caption:document.getElementById("pcaption").value,artTitle:document.getElementById("part").value||title,artSub:"Prévia de conteúdo",color:id%6});save();closeModal();setView("posts");toast("Conteúdo adicionado à demonstração.")}
function editPost(id){let p=posts.find(x=>x.id===id);modal(`<div class="modal-head"><h2>Editar conteúdo</h2><button class="outline" onclick="closeModal()">✕</button></div><div class="field"><label>Título interno</label><input id="etitle" value="${esc(p.title)}"></div><div class="field"><label>Legenda</label><textarea id="ecaption">${esc(p.caption)}</textarea></div><div class="field"><label>Status</label><select id="estatus">${["Aguardando aprovação","Aprovado","Alteração solicitada"].map(s=>`<option ${p.status===s?"selected":""}>${s}</option>`).join("")}</select></div><div class="modal-foot"><button class="outline" onclick="closeModal()">Cancelar</button><button class="primary" onclick="saveEdit(${id})">Salvar</button></div>`)}
function saveEdit(id){let p=posts.find(x=>x.id===id);p.title=document.getElementById("etitle").value;p.caption=document.getElementById("ecaption").value;p.status=document.getElementById("estatus").value;save();closeModal();render();toast("Alterações salvas neste navegador.")}
function openReview(id){let p=posts.find(x=>x.id===id);modal(`<div class="modal-head"><h2>Detalhes da aprovação</h2><button class="outline" onclick="closeModal()">✕</button></div>${art(p)}<p><b>${esc(p.title)}</b></p><p class="muted">${esc(client(p.client).name)} · ${esc(p.type)}</p><p>${esc(p.caption)}</p><p>Status: ${tag(p.status)}</p><div class="field"><label>Comentário do cliente (demonstração)</label><textarea placeholder="Nenhum comentário registrado neste protótipo."></textarea></div><div class="modal-foot"><button class="outline" onclick="closeModal()">Fechar</button><button class="primary" onclick="setStatus(${id},'Aprovado');closeModal()">Marcar aprovado</button></div>`)}
function setStatus(id,status){let p=posts.find(x=>x.id===id);p.status=status;save();render();toast(status==="Aprovado"?"Conteúdo marcado como aprovado.":"Status atualizado.")}
function requestChange(id){modal(`<div class="modal-head"><h2>Solicitar ajuste</h2><button class="outline" onclick="closeModal()">✕</button></div><div class="field"><label>O que você gostaria de alterar?</label><textarea id="feedback" placeholder="Descreva o ajuste desejado…"></textarea></div><div class="modal-foot"><button class="outline" onclick="closeModal()">Cancelar</button><button class="primary" onclick="submitChange(${id})">Enviar solicitação</button></div>`)}
function submitChange(id){let note=document.getElementById("feedback").value.trim();if(!note){toast("Escreva um comentário para solicitar ajuste.");return}let p=posts.find(x=>x.id===id);p.status="Alteração solicitada";p.feedback=note;save();closeModal();render();toast("Solicitação registrada nesta demonstração.")}
function openClient(id){selectedClient=id;setView("client")}
function searchPosts(){let q=document.getElementById("search").value.toLowerCase();document.getElementById("postCards").innerHTML=posts.filter(p=>(activeFilter==="Todos"||p.status===activeFilter)&&(p.title+" "+client(p.client).name).toLowerCase().includes(q)).map(p=>postCard(p)).join("")||'<div class="empty">Nenhum resultado.</div>'}
render();
 async function showLogin(){
  document.getElementById("loginScreen").style.display = "flex";
  const shell = document.querySelector(".shell");
  if(shell) shell.style.display = "none";
}

async function showApp(){
  document.getElementById("loginScreen").style.display = "none";
  const shell = document.querySelector(".shell");
  if(shell) shell.style.display = "flex";
}

document.getElementById("loginForm").addEventListener("submit", async function(e){
  e.preventDefault();

  const email = document.getElementById("loginEmail").value.trim();
  const password = document.getElementById("loginPassword").value;
  const message = document.getElementById("loginMessage");

  message.textContent = "Entrando...";

  const { data, error } = await sb.auth.signInWithPassword({
    email,
    password
  });

  if(error){
    message.textContent = "E-mail ou senha incorretos.";
    console.error(error);
    return;
  }

  await loadCloudData();
  await showApp();

  if(typeof render === "function"){
    render();
  }
});

async function startLP(){
  const { data: { session } } = await sb.auth.getSession();

  if(!session){
    await showLogin();
    return;
  }

  await loadCloudData();
  await showApp();

  if(typeof render === "function"){
    render();
  }
}

sb.auth.onAuthStateChange(async function(event, session){
  if(event === "SIGNED_OUT"){
    await showLogin();
  }
});

startLP();

</script>
</body></html>
